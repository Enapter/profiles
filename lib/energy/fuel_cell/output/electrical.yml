blueprint_spec: profile/1.0

display_name: Fuel Cell Electrical
description: Voltage, current, and power measurements for the fuel cell output.

telemetry:
  output_voltage:
    display_name: Output Voltage
    type: float
    unit: V
    description: DC voltage at the fuel cell output.

  output_current:
    display_name: Output Current
    type: float
    unit: A
    description: DC current at the fuel cell output.

  output_power:
    display_name: Output Power
    type: float
    unit: W
    description: DC power delivered by the fuel cell.
